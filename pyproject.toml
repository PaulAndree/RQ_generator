[project]
name = "rq-generator"
version = "0.1.0"
description = "Generate evidence-linked scientific document cards from PDF folders"
readme = "README.md"
authors = [
    { name = "Paul Andree", email = "paulandree@example.com" }
]
requires-python = ">=3.12"
dependencies = ["httpx>=0.28,<1", "pydantic>=2.10,<3"]

[project.optional-dependencies]
telemetry = ["langfuse>=3,<6"]
dev = ["pytest>=8,<10"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[project.scripts]
rq-generator = "rq_generator:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "SIM"]
